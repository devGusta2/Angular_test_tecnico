<div class="users-page">

    <div id="upper-page-field">
        <input type="text" placeholder="Filtrar usuário...">

        <button class="btn-primary" (click)="openDialog('create')">
            Cadastrar novo usuário
        </button>
    </div>

    <section class="table-container">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>E-mail</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Status</th>
                    <th style="text-align: center;">Ações</th>
                </tr>
            </thead>

            <tbody>
                @for(item of userList; track item.id){
                <tr>
                    <td>{{item.id}}</td>
                    <td>{{item.email}}</td>
                    <td>{{item.name}}</td>
                    <td>{{item.phone}}</td>
                    <td>{{item.active}}</td>
                    <td style="display: flex; justify-content: space-around;">
                        <button (click)="openDialog('view')">Ver</button>
                        <button (click)="openDialog('edit')">Editar</button>
                        <button (click)="openDialog('delete')">Desativar</button>
                    </td>
                    
                    
                </tr>
                }
            </tbody>
        </table>



    </section>

</div>
